<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Clube Aflora</title>
  <meta name="description" content="Workshop de pintura de ecobag com drinks. Garanta seu ingresso.">
  <meta name="theme-color" content="#f2e7fa">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cg fill='%235e0d24'%3E%3Ccircle cx='50' cy='23' r='21'/%3E%3Ccircle cx='71.11' cy='33.17' r='21'/%3E%3Ccircle cx='76.32' cy='56.01' r='21'/%3E%3Ccircle cx='61.71' cy='74.33' r='21'/%3E%3Ccircle cx='38.29' cy='74.33' r='21'/%3E%3Ccircle cx='23.68' cy='56.01' r='21'/%3E%3Ccircle cx='28.89' cy='33.17' r='21'/%3E%3Ccircle cx='50' cy='50' r='30'/%3E%3C/g%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Pinyon+Script&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!--INICIO-->
  <header class="topo">
    <div class="wrap">
      <span class="marca"><i class="flor" aria-hidden="true"></i><span class="marca-script">Clube</span><span class="marca-caps">Aflora</span></span>
    </div>
  </header>

  <main class="wrap pagina">
    <div class="capa">
      <img src="assets/ecobag.jpg" alt="Ecobags pintadas à mão sobre a mesa, com paletas de tinta e pincéis" width="900" height="1600">
      <span class="capa-data" id="capa-data">12 dez</span>
    </div>

    <div class="conteudo">
      <div class="cabeca">
        <span class="tipo" id="ev-tipo">Workshop</span>
        <h1 class="titulo" id="ev-titulo">Pintura de ecobag &amp; drinks</h1>
        <p class="resumo" id="ev-resumo"></p>
      </div>

      <ul class="info">
        <li>
          <span class="icone"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M9 3v4M15 3v4"/></svg></span>
          <span id="ev-quando"></span>
        </li>
        <li>
          <span class="icone"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg></span>
          <span id="ev-local"></span>
        </li>
      </ul>

      <ul class="inclui" id="ev-inclui" aria-label="Inclui"></ul>

      <section class="compra" id="compra" aria-labelledby="qtd-rotulo">
        <div>
          <h2 class="compra-rotulo" id="qtd-rotulo">Ingressos</h2>
          <p class="compra-ajuda" id="compra-ajuda"></p>
        </div>
        <div class="passo" role="group" aria-labelledby="qtd-rotulo">
          <button type="button" id="qtd-menos" aria-label="Diminuir quantidade">−</button>
          <output id="qtd-valor" aria-live="polite">1</output>
          <button type="button" id="qtd-mais" aria-label="Aumentar quantidade">+</button>
        </div>
      </section>
    </div>
  </main>

  <footer class="rodape">
    <div class="wrap">
      <a id="link-insta" href="https://www.instagram.com/clube.aflora/" target="_blank" rel="noopener">@clube.aflora</a>
    </div>
  </footer>

  <div class="barra-compra">
    <div class="barra-inner">
      <div class="barra-total">
        <span id="barra-qtd">1 ingresso</span>
        <strong id="barra-valor">R$ 0,00</strong>
      </div>
      <a class="btn-pagar" id="btn-pagar" href="#">Ir para o pagamento</a>
    </div>
  </div>

  <div class="folha-fundo" id="folha" hidden>
    <div class="folha" role="dialog" aria-modal="true" aria-labelledby="folha-titulo">
      <h2 class="folha-titulo" id="folha-titulo">Checkout ainda não conectado</h2>
      <p class="folha-texto">Coloque o endereço em <code>js/config.js</code>. Estes dados serão enviados:</p>
      <dl class="folha-dados" id="folha-dados"></dl>
      <button class="btn-secundario" id="folha-fechar" type="button">Fechar</button>
    </div>
  </div>
  <!--FIM-->

  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
